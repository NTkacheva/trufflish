:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1d2433; --muted:#5f6878; --line:#e3dfd6;
  --pri:#1f5fae; --pri-ink:#ffffff; --pri-soft:#e6eef9;
  --acc:#e8762b; --acc-soft:#fdeee2;
  --ok:#2a8a4a; --ok-soft:#e3f4e8; --bad:#c43c3c; --bad-soft:#fbe6e6;
  --r:14px; --fs:17px;
  --font:"Golos Text", "PT Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
body.kids{
  --bg:#fff8e8; --pri:#2b7bd8; --pri-soft:#e2f0ff; --acc:#ff8a1f; --r:22px; --fs:19px;
}
body.dark{
  --bg:#14171d; --card:#1e232c; --ink:#e9ecf1; --muted:#9aa3b2; --line:#2f3642;
  --pri:#5b9be6; --pri-soft:#22324a; --acc-soft:#3a2a1c; --ok-soft:#1d3526; --bad-soft:#3a1f22;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:var(--fs);line-height:1.5;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.65em;font-weight:700}
h2{font-size:1.3em;font-weight:700;margin-top:1.2em}
h3{font-size:1.1em;font-weight:600}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)}
.small{font-size:.86em}

/* Layout */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line)}
.top .ttl{font-weight:700;font-size:1.05em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{padding:22px 20px 110px;max-width:980px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15em;padding:4px 10px 16px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.95em}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--pri-soft)}
.nav a.on{background:var(--pri);color:var(--pri-ink)}
.nav svg{width:22px;height:22px;flex:none}
.bnav{display:none}
.iconbtn{border:0;background:transparent;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--pri-soft)}
.iconbtn svg{width:24px;height:24px}

@media (max-width:820px){
  .side{display:none}
  .side.open{display:block;position:fixed;left:0;top:0;bottom:0;z-index:60;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .content{padding:16px 14px 110px}
  .top{padding:8px 10px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;color:var(--muted);text-decoration:none;border-radius:10px}
  .bnav a.on{color:var(--pri);font-weight:600}
  .bnav svg{width:24px;height:24px}
}
@media (min-width:821px){ .menu-btn{display:none} }

/* Cards & grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);text-align:left;width:100%}
.tile:hover{border-color:var(--pri);box-shadow:0 2px 0 var(--pri-soft)}
.tile .ic{font-size:1.7em;width:46px;height:46px;flex:none;display:grid;place-items:center;background:var(--pri-soft);border-radius:12px}
.tile .tx{min-width:0}
.tile b{display:block;font-weight:600}
.tile .meta{font-size:.82em;color:var(--muted)}
.tile.done .ic{background:var(--ok-soft)}
.stars{color:#e0a100;letter-spacing:1px;font-size:.9em}
body.kids .tile .ic{font-size:2.1em;width:58px;height:58px;border-radius:18px}
body.kids .tile{border-width:2px}

.lvl{display:inline-block;font-size:.75em;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--acc-soft);color:var(--acc)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);min-height:44px}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:20px;height:20px}
body.kids .btn{border-radius:18px;min-height:52px;padding:12px 20px}

.play{border:0;width:40px;height:40px;border-radius:50%;background:var(--pri);color:#fff;display:inline-grid;place-items:center;flex:none}
.play.slow{background:var(--pri-soft);color:var(--pri)}
.play svg{width:20px;height:20px}
.play.speaking{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(31,95,174,.18)}}
body.kids .play{width:48px;height:48px}

/* Sentences */
.sent{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.sent:last-child{border-bottom:0}
.sent .bt{display:flex;gap:6px;flex:none}
.sent .tx{flex:1;min-width:0}
.en{font-size:1.08em;font-weight:500}
.ru{color:var(--muted);font-size:.93em;margin-top:2px}
.ru.hid{filter:blur(5px);cursor:pointer;user-select:none}
.note{font-size:.85em;color:var(--acc);margin-top:2px}
.w{cursor:pointer;border-radius:4px;padding:0 1px}
.w:hover{background:var(--pri-soft)}
.w.hl{background:#ffe69a}
.sent.now{background:linear-gradient(90deg,var(--pri-soft),transparent);border-radius:10px}

.theory{line-height:1.6}
.theory b{color:var(--pri)}
.ttable{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95em}
.ttable td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:middle}
.ttable tr{cursor:pointer}
.ttable tr:hover td{background:var(--pri-soft)}
.ttable td:nth-child(2){font-weight:600}
.ttable td.pb{width:44px}

/* Word cards */
.wcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.wcard:hover{border-color:var(--pri)}
.wcard .pic{font-size:2.4em;line-height:1.2;height:58px;display:grid;place-items:center}
.wcard .sw{width:54px;height:54px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.wcard .num{font-size:1.6em;font-weight:700;color:var(--pri)}
.wcard .e{font-weight:600}
.wcard .r{font-size:.85em;color:var(--muted)}
.wcard .star{position:absolute;top:6px;right:8px;font-size:.9em;color:#e0a100}
body.kids .wcard .pic{font-size:3.2em;height:76px}

/* Dialog */
.bub{display:flex;gap:10px;margin:10px 0;align-items:flex-end}
.bub.r{flex-direction:row-reverse}
.bub .av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--acc)}
.bub.r .av{background:var(--pri)}
.bub .bx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;max-width:78%}
.bub.r .bx{background:var(--pri-soft);border-color:transparent}
.bub .who{font-size:.78em;color:var(--muted);font-weight:600}
.bub.now .bx{outline:3px solid #ffd45c}
.bub .bx .row{margin-top:6px;gap:6px}
.bub .bx .play{width:34px;height:34px}
.bub.mine .hideme{color:var(--muted);font-style:italic}

/* Quiz */
.quiz{max-width:640px;margin:0 auto}
.qbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.qbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.qprompt{font-size:1.25em;font-weight:600;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:13px 16px;text-align:left;font-size:1.02em;font-weight:500}
.opt:hover{border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.inp{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);font-size:1.05em}
.inp:focus{outline:none;border-color:var(--pri)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:500}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:500}
.chip.used{visibility:hidden}
.result{text-align:center;padding:20px 0}
.result .big{font-size:3.4em;font-weight:700;color:var(--pri);line-height:1}
.result .stars{font-size:2.2em}

/* Flashcard */
.flash{perspective:1000px;max-width:460px;margin:0 auto 16px;height:300px;cursor:pointer}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.fl .in{transform:rotateY(180deg)}
.flash .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.flash .bk{transform:rotateY(180deg);background:var(--pri-soft)}
.flash .pic{font-size:4em;line-height:1}
.flash .sw{width:90px;height:90px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.flash .e{font-size:1.7em;font-weight:700}
.flash .r{font-size:1.4em;font-weight:600}

/* Popup */
.pop{position:fixed;z-index:80;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:14px 16px;width:min(340px,calc(100vw - 20px))}
.pop .pw{font-size:1.3em;font-weight:700}
.pop .pt{margin:4px 0 10px}
.pop .row{gap:6px}
.pop .btn{min-height:38px;padding:6px 10px;font-size:.88em}
.pop .x{position:absolute;right:6px;top:6px}
@media (max-width:820px){.pop{left:10px!important;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));top:auto!important;width:auto}}

.banner{background:var(--acc-soft);border:1px solid #f3c9a6;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.92em}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:90;font-size:.92em}

.stat{display:flex;flex-direction:column}
.stat .n{font-size:2.1em;font-weight:700;color:var(--pri);line-height:1.1}
.stat .l{font-size:.85em;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hero{background:var(--pri);color:#fff;border-radius:var(--r);padding:20px;margin-bottom:16px}
.hero h1{color:#fff}
.hero .btn{background:#fff;color:var(--pri);border-color:#fff}
body.kids .hero{background:linear-gradient(135deg,#2b7bd8,#7b4fd8)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:600;font-size:.92em}
.seg button.on{background:var(--pri);color:#fff}
.field{margin:14px 0}
.field label{display:block;font-weight:600;margin-bottom:6px}
select.inp{appearance:auto}
input[type=range]{width:100%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}

.clock{width:220px;height:220px;display:block;margin:0 auto 10px}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.abc button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center}
.abc .L{font-size:1.8em;font-weight:700;color:var(--pri);line-height:1.1}
.abc .ex{font-size:.82em;color:var(--muted)}

.plist{list-style:none;padding:0;margin:10px 0}
.plist li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:var(--card);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist li.on{border-color:var(--pri);background:var(--pri-soft);font-weight:600}
audio{width:100%;margin:10px 0}
.tts span.cur{background:#ffe69a;border-radius:4px}
textarea.inp{min-height:130px;resize:vertical}
.wb{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.wb .wi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.92em}
.wb .wi b{display:block}
.crumbs{font-size:.9em;margin-bottom:10px}
.crumbs a{text-decoration:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.hidden{display:none!important}

}

let Q=null;
function startQuiz(title,qs,onEnd,back){Q={title,qs,i:0,score:0,answered:false,onEnd,back,order:[]};go("#/quiz")}
function vQuiz(){
  if(!Q)return `<p>Тест не выбран. <a href="#/practice">Открыть тренажёр</a></p>`;
  if(Q.i>=Q.qs.length){
    const pct=Math.round(Q.score/Q.qs.length*100);const st=pct>=90?3:pct>=70?2:pct>=40?1:0;
    if(!Q.ended){Q.ended=true;Q.stars=st;if(Q.onEnd)Q.onEnd(st,pct);markDay();if(st>=2)setTimeout(confetti,100)}
    return `<div class="quiz card result"><div class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</div><div class="big">${Q.score} из ${Q.qs.length}</div><p>${pct>=90?(S.kids?"Супер! Ты молодец!":"Отличный результат!"):pct>=70?"Хорошо! Ещё немного практики.":"Повторите правило и попробуйте ещё раз."}</p>
    <div class="row" style="justify-content:center"><button class="btn" data-act="qretry">Пройти ещё раз</button>${Q.back?`<a class="btn pri" href="${Q.back}">Готово</a>`:""}</div></div>`}
  const q=Q.qs[Q.i];
  let body="";
  const promptHtml=isRu(q.prompt)&&!q.prompt.includes("___")?esc(q.prompt):(q.ru?esc(q.prompt):en(q.prompt));
  if(q.listen)body+=`<div class="row" style="margin-bottom:14px">${playBtns(q.listen)}<span class="muted">Нажмите, чтобы послушать ещё раз</span></div>`;
  if(q.pic)body+=`<div class="wcard" style="border:0;cursor:default">${pic(q.pic)}</div>`;
  if(q.type==="choice")body+=`<div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-opt="${j}">${isRu(o.t)?esc(o.t):en(o.t)}</button>`).join("")}</div>`;
  if(q.type==="input")body+=`<input class="inp" id="qin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.ph||"Введите ответ"}"><div class="row" style="margin-top:10px"><button class="btn pri" data-act="qcheck">Проверить</button></div>`;
  if(q.type==="order"){if(!Q.pool){Q.pool=shuffle(q.ans.replace(/[.!?,]/g,"").split(" ").map((t,k)=>({t,k})));if(Q.pool.map(x=>x.t).join(" ")===q.ans.replace(/[.!?,]/g,""))Q.pool=shuffle(Q.pool)}
    body+=`<div class="chips" id="ord">${Q.order.map(x=>`<button class="chip" data-un="${x.k}">${esc(x.t)}</button>`).join("")}</div><div class="chips" style="border-style:solid">${Q.pool.map(x=>`<button class="chip ${Q.order.includes(x)?"used":""}" data-ch="${x.k}">${esc(x.t)}</button>`).join("")}</div><div class="row"><button class="btn pri" data-act="qcheck">Проверить</button><button class="btn ghost" data-act="qclear">Сбросить</button></div>`}
  if(q.type==="speak")body+=`<div class="sent" data-en="${esc(q.ans)}"><div class="bt">${playBtns(q.ans)}</div><div class="tx"><div class="en">${en(q.ans)}</div><div class="ru">${esc(q.ru||"")}</div></div></div><div class="row" style="margin-top:12px"><button class="btn acc" data-act="qmic">${I.mic} Сказать</button><button class="btn ghost" data-act="qskip">Пропустить</button></div>`;
  return `<div class="quiz"><div class="row"><b>${esc(Q.title)}</b><span class="spacer"></span><span class="muted">${Q.i+1} из ${Q.qs.length}</span></div><div class="qbar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
  <div class="card"><div class="qprompt">${promptHtml}</div>${body}<div id="fb"></div></div></div>`}
function qFeedback(ok,right){
  Q.answered=true;if(ok)Q.score++;
  const fb=$("#fb");const q=Q.qs[Q.i];
  fb.innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?(S.kids?pick(["Молодец!","Отлично!","Супер!","Правильно!"],1)[0]:"Верно."):"Неверно. Правильный ответ: <b>"+esc(right)+"</b>"}</div><div class="row" style="margin-top:12px"><button class="btn pri" data-act="qnext">Дальше</button></div>`;
  const say=q.say||(q.type==="order"||q.type==="speak"?q.ans:null)||(q.prompt.includes("___")&&right&&!isRu(right)&&!isRu(q.prompt)?q.prompt.replace("___",right).replace(/\s*\(.*?\)\s*/g," ").trim():null);
  if(say&&!isRu(say))speak(say);
  $$(".opt").forEach(b=>b.disabled=true);
  const nb=$("[data-act=qnext]");if(nb)nb.focus();
}

function srcItems(src){
  if(!src||src==="all")return [].concat(...vocabList().map(t=>t.words.map(w=>({en:w[0],ru:w[1],pic:w[2]}))));
  const [k,id]=src.split(":");
  if(k==="v"){const t=V.find(x=>x.id===id);return t?t.words.map(w=>({en:w[0],ru:w[1],pic:w[2]})):[]}
  if(k==="p"){const c=P.find(x=>x.id===id);return c?c.items.map(w=>({en:w[0],ru:w[1]})):[]}
  if(k==="my")return S.my.map(m=>({en:m[0],ru:m[1]}));
  if(k==="ex")return [].concat(...L.map(l=>l.ex.map(e=>({en:e[0],ru:e[1]}))));
  return []}
function srcName(src){if(!src||src==="all")return "Все слова";const [k,id]=src.split(":");if(k==="v")return (V.find(x=>x.id===id)||{}).title;if(k==="p")return (P.find(x=>x.id===id)||{}).title;if(k==="my")return "Мои слова";if(k==="ex")return "Примеры из уроков";return ""}
function buildPractice(mode,src){
  const items=srcItems(src);if(items.length<4){toast("Нужно хотя бы 4 слова или фразы");return}
  const set=pick(items,Math.min(10,items.length));let qs=[];
  const cleanEn=e=>e.split(" / ")[0];
  if(mode==="choose")qs=set.map(it=>({type:"choice",prompt:cleanEn(it.en),pic:it.pic,say:cleanEn(it.en),opts:shuffle([{t:it.ru,ok:true}].concat(pick(items.filter(x=>x!==it&&x.ru!==it.ru),3).map(x=>({t:x.ru}))))}));
  if(mode==="reverse")qs=set.map(it=>({type:"choice",prompt:it.ru,ru:1,pic:it.pic,say:cleanEn(it.en),opts:shuffle([{t:cleanEn(it.en),ok:true}].concat(pick(items.filter(x=>x!==it),3).map(x=>({t:cleanEn(x.en)}))))}));
  if(mode==="listen")qs=set.map(it=>({type:"choice",prompt:"Что прозвучало? Выберите перевод",listen:cleanEn(it.en),say:cleanEn(it.en),opts:shuffle([{t:it.ru,ok:true}].concat(pick(items.filter(x=>x!==it&&x.ru!==it.ru),3).map(x=>({t:x.ru}))))}));
  if(mode==="dict")qs=set.map(it=>({type:"input",prompt:"Послушайте и напишите по-английски",listen:cleanEn(it.en),ans:[cleanEn(it.en)],loose:true,ph:"Напишите, что услышали"}));
  if(mode==="speak")qs=set.map(it=>({type:"speak",prompt:"Нажмите «Сказать» и произнесите",ans:cleanEn(it.en),ru:it.ru}));
  if(mode==="order"){const ph=items.filter(x=>x.en.split(" ").length>=3&&x.en.split(" ").length<=10&&!x.en.includes("…"));qs=pick(ph,Math.min(8,ph.length)).map(it=>({type:"order",prompt:"Соберите фразу: "+it.ru,ans:it.en}))}
  const names={choose:"Тест",reverse:"Перевод на английский",listen:"Аудирование",dict:"Диктант",speak:"Говорение",order:"Собери фразу"};
  startQuiz(names[mode]+": "+srcName(src),qs,null,"#/practice");
  if(qs[0]&&qs[0].listen)setTimeout(()=>speak(qs[0].listen),400);
}

/* ---- Translator ---- */
function searchAll(q){
  q=q.trim().toLowerCase();if(!q)return [];const out=[];const seen=new Set();
  const add=(e,r,src)=>{const k=e+"|"+r;if(seen.has(k))return;seen.add(k);out.push([e,r,src])};
  const ru=isRu(q);const hit=(e,r)=>ru?r.toLowerCase().includes(q):e.toLowerCase().includes(q);
  V.forEach(t=>t.words.forEach(w=>{if(hit(w[0],w[1]))add(w[0],w[1],t.title)}));
  P.forEach(c=>c.items.forEach(w=>{if(hit(w[0],w[1]))add(w[0],w[1],c.title)}));
  if(ru)Object.keys(LEX).forEach(k=>{if(LEX[k].toLowerCase().includes(q))add(k,LEX[k],"Словарь")});
  else Object.keys(LEX).forEach(k=>{if(k===q||k.startsWith(q+" "))add(k,LEX[k],"Словарь")});
  L.forEach(l=>l.ex.forEach(e=>{if(hit(e[0],e[1]))add(e[0],e[1],"Урок: "+l.title)}));
  D.forEach(d=>d.lines.forEach(e=>{if(hit(e[1],e[2]))add(e[1],e[2],"Диалог: "+d.title)}));
  // rank: exact first
  out.sort((a,b)=>{const ea=(ru?a[1]:a[0]).toLowerCase(),eb=(ru?b[1]:b[0]).toLowerCase();return (ea===q?0:ea.startsWith(q)?1:2)-(eb===q?0:eb.startsWith(q)?1:2)||ea.length-eb.length});
  return out.slice(0,40)}
function vTranslate(){
  const q=route.q.q||"";
  const ru=isRu(q);
  let res="";
  if(q){
    const hits=searchAll(q);
    if(!ru){const toks=q.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’-]*/g)||[];
      if(toks.length>1)res+=`<h3>По словам</h3><div class="wb">${toks.map(t=>{const r=lookup(t);return `<div class="wi"><b>${esc(t)}</b>${r?esc(r.tr):'<span class="muted">нет в словаре</span>'}</div>`}).join("")}</div>`;
      else if(toks.length===1){const r=lookup(toks[0]);if(r)res+=`<div class="card" style="margin-bottom:12px"><div class="row"><div style="flex:1"><div class="en" style="font-size:1.5em">${esc(toks[0])}</div><div style="font-size:1.15em">${esc(r.tr)}</div></div>${playBtns(toks[0])}<button class="btn" data-act="saveword" data-w="${esc(r.key)}" data-t="${esc(r.tr)}">В мои слова</button></div></div>`}}
    res+=hits.length?`<h3>Найдено в приложении</h3><div class="card">${hits.map(h=>sentence(h[0],h[1],{note:h[2]})).join("")}</div>`:`<p class="muted">Во встроенных материалах совпадений нет. Воспользуйтесь онлайн-переводчиком.</p>`;
    const sl=ru?"ru":"en",tl=ru?"en":"ru";
    res+=`<div class="row" style="margin-top:14px"><a class="btn" target="_blank" rel="noopener" href="https://translate.yandex.ru/?source_lang=${sl}&target_lang=${tl}&text=${encodeURIComponent(q)}">Открыть в Яндекс Переводчике</a><a class="btn" target="_blank" rel="noopener" href="https://translate.google.com/?sl=${sl}&tl=${tl}&op=translate&text=${encodeURIComponent(q)}">Открыть в Google Переводчике</a></div>`;
  }
  return `<p class="muted">Введите английское или русское слово либо фразу. Перевод ищется во встроенном словаре и всех материалах приложения, работает без интернета.</p>
  <form id="trf" class="row"><input class="inp" id="trq" style="flex:1;min-width:200px" value="${esc(q)}" placeholder="Например: cold, спасибо, How much is it?" autocomplete="off"><button class="btn pri">Найти</button>${q&&!ru?playBtns(q):""}</form>${res}`}

/* ---- Clock ---- */
const NUM=["twelve","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
function timeWords(h,m){const H=h%12||12,N=(h%12)+1;const nm={5:"five",10:"ten",15:"quarter",20:"twenty",25:"twenty-five",30:"half"};
  if(m===0)return NUM[H]+" o'clock";if(m<=30)return nm[m]+" past "+NUM[H];return nm[60-m]+" to "+NUM[N>12?1:N]}
function clockSvg(h,m,id){const ha=((h%12)+m/60)*30,ma=m*6;let t="";for(let k=1;k<=12;k++){const a=k*30*Math.PI/180;t+=`<text x="${100+72*Math.sin(a)}" y="${106-72*Math.cos(a)}" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">${k}</text>`}
  let ticks="";for(let k=0;k<60;k++){const a=k*6*Math.PI/180,r1=k%5?88:84;ticks+=`<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+92*Math.sin(a)}" y2="${100-92*Math.cos(a)}" stroke="currentColor" stroke-width="${k%5?1:2.5}" opacity=".6"/>`}
  return `<svg class="clock" id="${id||""}" viewBox="0 0 200 200" style="color:var(--ink)"><circle cx="100" cy="100" r="96" fill="var(--card)" stroke="var(--pri)" stroke-width="6"/>${ticks}${t}<line x1="100" y1="100" x2="${100+45*Math.sin(ha*Math.PI/180)}" y2="${100-45*Math.cos(ha*Math.PI/180)}" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/><line x1="100" y1="100" x2="${100+70*Math.sin(ma*Math.PI/180)}" y2="${100-70*Math.cos(ma*Math.PI/180)}" stroke="var(--acc)" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="var(--ink)"/></svg>`}
let CK=null;
function newClock(){const h=1+Math.floor(Math.random()*12),m=Math.floor(Math.random()*12)*5;const right=timeWords(h,m);const wrong=new Set();while(wrong.size<3){const h2=1+Math.floor(Math.random()*12),m2=(m+[0,5,10,15,30,45][Math.floor(Math.random()*6)]+60)%60;const w=timeWords(Math.random()<.5?h:h2,m2);if(w!==right)wrong.add(w)}
  CK={h,m,right,opts:shuffle([right].concat([...wrong])),done:false,score:(CK?CK.score:0),n:(CK?CK.n:0)}}
function vClock(){if(!CK)newClock();
  const dig=`${CK.h}:${String(CK.m).padStart(2,"0")}`;
  return `<p class="muted">Посмотрите на часы и выберите, как правильно назвать время. Шпаргалка: <b>past</b> — «после» (первая половина часа), <b>to</b> — «до» (вторая половина), <b>quarter</b> — 15 минут, <b>half</b> — 30 минут.</p>
  <div class="card quiz" style="text-align:center">${clockSvg(CK.h,CK.m)}<div class="muted" style="font-size:1.2em;font-weight:700">${dig}</div><div class="qprompt">What time is it?</div>
  <div class="opts">${CK.opts.map((o,j)=>`<button class="opt" data-ck="${j}">It's ${esc(o)}.</button>`).join("")}</div><div id="fb"></div>

  else if(a==="toggleru"){S.showRu=!S.showRu;save();render()}
  else if(a==="saveword"){const k=act.dataset.w;if(!S.my.some(m=>m[0].toLowerCase()===k)){S.my.unshift([k,act.dataset.t]);save();toast("Добавлено в «Мои слова»")}act.textContent="В моих словах"}
  else if(a==="playall"){const rows=$$("#view .sent");const my=++DL.run;for(const r of rows){if(my!==DL.run||!document.body.contains(r))break;rows.forEach(x=>x.classList.remove("now"));r.classList.add("now");const ok=await speak(r.dataset.en);if(!ok)break;await new Promise(x=>setTimeout(x,300))}rows.forEach(x=>x.classList.remove("now"))}
  else if(a==="startlesson"){const l=L.find(x=>x.id===route.id);startQuiz(l.title,lessonQuiz(l),(st,pct)=>{const old=S.lessons[l.id];if(!old||old.stars<=st)S.lessons[l.id]={stars:Math.max(st,1),pct};save()},"#/lesson/"+l.id)}
  else if(a==="qnext"){Q.i++;Q.answered=false;Q.order=[];Q.pool=null;render();const q=Q.qs[Q.i];if(q&&q.listen)setTimeout(()=>speak(q.listen),300)}
  else if(a==="qretry"){Q.i=0;Q.score=0;Q.answered=false;Q.ended=false;Q.order=[];Q.pool=null;Q.qs=shuffle(Q.qs);render();const q=Q.qs[0];if(q&&q.listen)setTimeout(()=>speak(q.listen),300)}
  else if(a==="qclear"){Q.order=[];render()}
  else if(a==="qskip"){Q.answered=true;$("#fb").innerHTML=`<div class="row" style="margin-top:12px"><button class="btn pri" data-act="qnext">Дальше</button></div>`}
  else if(a==="qcheck"&&Q&&!Q.answered){const q=Q.qs[Q.i];
    if(q.type==="input"){const v=$("#qin").value;const ok=q.ans.some(x=>q.loose?simil(x,v)>=0.99||clean(x)===clean(v):clean(x)===clean(v));qFeedback(ok,q.ans[0]);$("#qin").disabled=true}
    if(q.type==="order"){if(!Q.order.length)return;const ok=clean(Q.order.map(x=>x.t).join(" "))===clean(q.ans);qFeedback(ok,q.ans)}}
  else if(a==="qmic"){const q=Q.qs[Q.i];act.disabled=true;act.innerHTML=I.mic+" Говорите…";try{const alts=await listen();const best=Math.max(0,...alts.map(x=>simil(x,q.ans)));qFeedback(best>=0.75,q.ans);if(alts[0])$("#fb").insertAdjacentHTML("afterbegin",`<p class="small muted">Услышано: «${esc(alts[0])}»</p>`)}catch(err){toast(err==="not-allowed"?"Разрешите доступ к микрофону":"Не удалось распознать речь");act.disabled=false;act.innerHTML=I.mic+" Сказать"}}
  else if(a==="flip"){FC.flip=!FC.flip;$(".flash").classList.toggle("fl",FC.flip);if(!FC.flip)speak(FC.items[FC.i].en.split(" / ")[0])}
  else if(a==="fcyes"||a==="fcno"){const c=FC.items[FC.i];if(a==="fcyes"){FC.ok++;S.known[c.en]=(S.known[c.en]||0)+1}else{delete S.known[c.en];FC.items.push(Object.assign({},c,{again:1}));if(FC.items.length>60)FC.items.pop()}save();FC.i++;FC.flip=false;render();if(FC.i<FC.items.length)speak(FC.items[FC.i].en.split(" / ")[0])}
  else if(a==="fcagain"){FC=null;render()}
  else if(a==="dplay"){const d=D.find(x=>x.id===route.id);playDialog(d,false)}
  else if(a==="drole"){const d=D.find(x=>x.id===route.id);playDialog(d,true)}
  else if(a==="reveal"){const b=act.closest(".bx");$(".en",b).classList.remove("hidden");$(".hideme",b).classList.add("hidden");act.remove()}
  else if(a==="dmic"){const bub=act.closest(".bub");const target=bub.dataset.en;act.disabled=true;try{const alts=await listen();const best=Math.max(0,...alts.map(x=>simil(x,target)));const bx=$(".bx",bub);$(".en",bx).classList.remove("hidden");$(".hideme",bx).classList.add("hidden");bx.insertAdjacentHTML("beforeend",`<div class="fb ${best>=0.75?"ok":"bad"}" style="margin-top:6px;padding:6px 10px">${best>=0.75?"Отлично!":"Попробуйте ещё раз. Услышано: «"+esc(alts[0]||"")+"»"}</div>`)}catch(err){toast("Не удалось распознать речь")}act.disabled=false}
  else if(a==="cknext"){newClock();render()}
  else if(a==="abcall"){const my=++DL.run;for(const x of ABC){if(my!==DL.run)break;const ok=await speak(x[0]);if(!ok)break}}
  else if(a==="reset"){if(act.dataset.sure){S.lessons={};S.known={};S.my=[];S.days=[];save();render();toast("Прогресс сброшен")}else{act.dataset.sure="1";act.textContent="Точно сбросить?";act.classList.add("acc")}}
  else if(a==="ab5"){$("#aud").currentTime-=5}
  else if(a==="af5"){$("#aud").currentTime+=5}
  else if(a==="abloop"){const au=$("#aud");if(PL.a===null){PL.a=au.currentTime;act.textContent="Отметить конец"}else if(PL.b===null){PL.b=au.currentTime;if(PL.b<=PL.a){PL.a=PL.b=null;act.textContent="Повтор фрагмента";return}au.currentTime=PL.a;au.play();act.textContent="Выключить повтор"}else{PL.a=PL.b=null;act.textContent="Повтор фрагмента"}}
  else if(a==="ttsgo")ttsRead(false);
  else if(a==="ttsslow")ttsRead(true);
  else if(a==="ttsstop"){TTS.run++;stopSpeak()}
});
document.addEventListener("submit",e=>{if(e.target.id==="trf"){e.preventDefault();go("#/translate?q="+encodeURIComponent($("#trq").value.trim()))}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="qin"){e.preventDefault();const b=$("[data-act=qnext]")||$("[data-act=qcheck]");if(b)b.click()}if(e.key==="Escape")closePop()});
document.addEventListener("change",e=>{
  if(e.target.id==="psrc")history.replaceState(null,"","#/practice?src="+e.target.value);
  if(e.target.id==="vsel"){S.voice=e.target.value;save();speak("Hello! Nice to meet you.")}
  if(e.target.id==="pfile"){PL.files=Array.from(e.target.files).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));plRender();if(PL.files.length)plPlay(0)}
});
document.addEventListener("input",e=>{if(e.target.id==="rate"){S.rate=+e.target.value;$("#rv").textContent=S.rate;save()}});
document.addEventListener("timeupdate",e=>{if(e.target.id==="aud"&&PL.a!==null&&PL.b!==null&&e.target.currentTime>=PL.b){e.target.currentTime=PL.a}},true);
document.addEventListener("ended",e=>{if(e.target.id==="aud"&&PL.i<PL.files.length-1)plPlay(PL.i+1)},true);

/* ---------- Init ---------- */
shell();parse();render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();

</script></body></html>
