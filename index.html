  --font:"Golos Text", "PT Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
body.kids{
  --bg:#fff8e8; --pri:#2b7bd8; --pri-soft:#e2f0ff; --acc:#ff8a1f; --r:22px; --fs:19px;
}
body.dark{
  --bg:#14171d; --card:#1e232c; --ink:#e9ecf1; --muted:#9aa3b2; --line:#2f3642;
  --pri:#5b9be6; --pri-soft:#22324a; --acc-soft:#3a2a1c; --ok-soft:#1d3526; --bad-soft:#3a1f22;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:var(--fs);line-height:1.5;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.65em;font-weight:700}
h2{font-size:1.3em;font-weight:700;margin-top:1.2em}
h3{font-size:1.1em;font-weight:600}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)}
.small{font-size:.86em}

/* Layout */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line)}
.top .ttl{font-weight:700;font-size:1.05em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{padding:22px 20px 110px;max-width:980px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15em;padding:4px 10px 16px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.95em}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--pri-soft)}
.nav a.on{background:var(--pri);color:var(--pri-ink)}
.nav svg{width:22px;height:22px;flex:none}
.bnav{display:none}
.iconbtn{border:0;background:transparent;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--pri-soft)}
.iconbtn svg{width:24px;height:24px}

@media (max-width:820px){
  .side{display:none}
  .side.open{display:block;position:fixed;left:0;top:0;bottom:0;z-index:60;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .content{padding:16px 14px 110px}
  .top{padding:8px 10px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;color:var(--muted);text-decoration:none;border-radius:10px}
  .bnav a.on{color:var(--pri);font-weight:600}
  .bnav svg{width:24px;height:24px}
}
@media (min-width:821px){ .menu-btn{display:none} }

/* Cards & grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);text-align:left;width:100%}
.tile:hover{border-color:var(--pri);box-shadow:0 2px 0 var(--pri-soft)}
.tile .ic{font-size:1.7em;width:46px;height:46px;flex:none;display:grid;place-items:center;background:var(--pri-soft);border-radius:12px}
.tile .tx{min-width:0}
.tile b{display:block;font-weight:600}
.tile .meta{font-size:.82em;color:var(--muted)}
.tile.done .ic{background:var(--ok-soft)}
.stars{color:#e0a100;letter-spacing:1px;font-size:.9em}
body.kids .tile .ic{font-size:2.1em;width:58px;height:58px;border-radius:18px}
body.kids .tile{border-width:2px}

.lvl{display:inline-block;font-size:.75em;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--acc-soft);color:var(--acc)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);min-height:44px}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:20px;height:20px}
body.kids .btn{border-radius:18px;min-height:52px;padding:12px 20px}

.play{border:0;width:40px;height:40px;border-radius:50%;background:var(--pri);color:#fff;display:inline-grid;place-items:center;flex:none}
.play.slow{background:var(--pri-soft);color:var(--pri)}
.play svg{width:20px;height:20px}
.play.speaking{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(31,95,174,.18)}}
body.kids .play{width:48px;height:48px}

/* Sentences */
.sent{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.sent:last-child{border-bottom:0}
.sent .bt{display:flex;gap:6px;flex:none}
.sent .tx{flex:1;min-width:0}
.en{font-size:1.08em;font-weight:500}
.ru{color:var(--muted);font-size:.93em;margin-top:2px}
.ru.hid{filter:blur(5px);cursor:pointer;user-select:none}
.note{font-size:.85em;color:var(--acc);margin-top:2px}
.w{cursor:pointer;border-radius:4px;padding:0 1px}
.w:hover{background:var(--pri-soft)}
.w.hl{background:#ffe69a}
.sent.now{background:linear-gradient(90deg,var(--pri-soft),transparent);border-radius:10px}

.theory{line-height:1.6}
.theory b{color:var(--pri)}
.ttable{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95em}
.ttable td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:middle}
.ttable tr{cursor:pointer}
.ttable tr:hover td{background:var(--pri-soft)}
.ttable td:nth-child(2){font-weight:600}
.ttable td.pb{width:44px}

/* Word cards */
.wcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.wcard:hover{border-color:var(--pri)}
.wcard .pic{font-size:2.4em;line-height:1.2;height:58px;display:grid;place-items:center}
.wcard .sw{width:54px;height:54px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.wcard .num{font-size:1.6em;font-weight:700;color:var(--pri)}
.wcard .e{font-weight:600}
.wcard .r{font-size:.85em;color:var(--muted)}
.wcard .star{position:absolute;top:6px;right:8px;font-size:.9em;color:#e0a100}
body.kids .wcard .pic{font-size:3.2em;height:76px}

/* Dialog */
.bub{display:flex;gap:10px;margin:10px 0;align-items:flex-end}
.bub.r{flex-direction:row-reverse}
.bub .av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--acc)}
.bub.r .av{background:var(--pri)}
.bub .bx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;max-width:78%}
.bub.r .bx{background:var(--pri-soft);border-color:transparent}
.bub .who{font-size:.78em;color:var(--muted);font-weight:600}
.bub.now .bx{outline:3px solid #ffd45c}
.bub .bx .row{margin-top:6px;gap:6px}
.bub .bx .play{width:34px;height:34px}
.bub.mine .hideme{color:var(--muted);font-style:italic}

/* Quiz */
.quiz{max-width:640px;margin:0 auto}
.qbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.qbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.qprompt{font-size:1.25em;font-weight:600;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:13px 16px;text-align:left;font-size:1.02em;font-weight:500}
.opt:hover{border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.inp{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);font-size:1.05em}
.inp:focus{outline:none;border-color:var(--pri)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:500}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:500}
.chip.used{visibility:hidden}
.result{text-align:center;padding:20px 0}
.result .big:not(.btn){font-size:3.4em;font-weight:700;color:var(--pri);line-height:1}
.result .stars{font-size:2.2em}

/* Flashcard */
.flash{perspective:1000px;max-width:460px;margin:0 auto 16px;height:300px;cursor:pointer}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.fl .in{transform:rotateY(180deg)}
.flash .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.flash .bk{transform:rotateY(180deg);background:var(--pri-soft)}
.flash .pic{font-size:4em;line-height:1}
.flash .sw{width:90px;height:90px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.flash .e{font-size:1.7em;font-weight:700}
.flash .r{font-size:1.4em;font-weight:600}

/* Popup */
.pop{position:fixed;z-index:80;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:14px 16px;width:min(340px,calc(100vw - 20px))}
.pop .pw{font-size:1.3em;font-weight:700}
.pop .pt{margin:4px 0 10px}
.pop .row{gap:6px}
.pop .btn{min-height:38px;padding:6px 10px;font-size:.88em}
.pop .x{position:absolute;right:6px;top:6px}
@media (max-width:820px){.pop{left:10px!important;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));top:auto!important;width:auto}}

.banner{background:var(--acc-soft);border:1px solid #f3c9a6;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.92em}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:90;font-size:.92em}

.stat{display:flex;flex-direction:column}
.stat .n{font-size:2.1em;font-weight:700;color:var(--pri);line-height:1.1}
.stat .l{font-size:.85em;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hero{background:var(--pri);color:#fff;border-radius:var(--r);padding:20px;margin-bottom:16px}
.hero h1{color:#fff}
.hero .btn{background:#fff;color:var(--pri);border-color:#fff}
body.kids .hero{background:linear-gradient(135deg,#2b7bd8,#7b4fd8)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:600;font-size:.92em}
.seg button.on{background:var(--pri);color:#fff}
.field{margin:14px 0}
.field label{display:block;font-weight:600;margin-bottom:6px}
select.inp{appearance:auto}
input[type=range]{width:100%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}

.clock{width:220px;height:220px;display:block;margin:0 auto 10px}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.abc button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center}
.abc .L{font-size:1.8em;font-weight:700;color:var(--pri);line-height:1.1}
.abc .ex{font-size:.82em;color:var(--muted)}

.plist{list-style:none;padding:0;margin:10px 0}
.plist li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:var(--card);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist li.on{border-color:var(--pri);background:var(--pri-soft);font-weight:600}
audio{width:100%;margin:10px 0}
.tts span.cur{background:#ffe69a;border-radius:4px}
textarea.inp{min-height:130px;resize:vertical}
.wb{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.wb .wi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.92em}
.wb .wi b{display:block}
.crumbs{font-size:.9em;margin-bottom:10px}
.crumbs a{text-decoration:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.hidden{display:none!important}

/* ===== v2: новые элементы интерфейса ===== */
.btn.big{min-height:52px;padding:12px 22px;font-size:1.04em}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.88em;border-radius:10px}
.play.rec{background:var(--acc-soft);color:var(--acc)}
.play.pmini{width:30px;height:30px;margin-left:8px;vertical-align:middle}
.play.pmini svg{width:15px;height:15px}
.play.sm{width:34px;height:34px}
.chipxp{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);font-size:.92em;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px;white-space:nowrap}
.chipxp:empty{display:none}
.avbtn{width:40px;height:40px;border-radius:50%;background:var(--pri-soft);display:grid;place-items:center;font-size:1.35em;text-decoration:none;flex:none}
@media (max-width:820px){.hide-sm{display:none}.chipxp{padding:4px 9px;gap:7px;font-size:.85em}}

.hello{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.hav{width:64px;height:64px;border-radius:50%;background:var(--pri-soft);display:grid;place-items:center;font-size:2.2em;flex:none}
.hav.sm{width:40px;height:40px;font-size:1.35em}
.lvbar{display:flex;align-items:center;gap:10px;margin-top:8px;font-weight:600;font-size:.9em}
.pb{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden;min-width:60px}
.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#f5b041);border-radius:6px}
.goal{text-align:center;flex:none}
.ring{width:84px;height:84px;color:var(--ink)}
@media (max-width:520px){.hello{flex-wrap:wrap}.goal{order:3;width:100%;display:flex;align-items:center;gap:10px;justify-content:flex-start}.ring{width:64px;height:64px}}

.help{position:relative;margin-bottom:14px;background:var(--pri-soft);border-color:transparent}
.help .x{position:absolute;right:6px;top:6px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:10px 0}
.hgrid>div{display:flex;gap:10px;align-items:center;font-size:.92em}
.hgrid .play{width:34px;height:34px}
.hgrid .hi{width:34px;height:34px;border-radius:8px;background:#ffe69a;display:grid;place-items:center;font-weight:700;flex:none;color:#1d2433}

.cont{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-bottom:6px;border-left:5px solid var(--acc)}
.cont .tx{flex:1;display:flex;flex-direction:column}
.cont .go{width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}
.cont .go svg{width:20px;height:20px}

.plan{display:grid;gap:10px}
.ptask{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink)}
.ptask:hover{border-color:var(--pri)}
.ptask .pchk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700;color:#fff}
.ptask .pchk svg{width:18px;height:18px}
.ptask.done .pchk{background:var(--ok);border-color:var(--ok)}
.ptask.done b{text-decoration:line-through;color:var(--muted)}
.ptask.warn .pchk{background:var(--acc);border-color:var(--acc)}
.pic2{font-size:1.6em;width:44px;text-align:center;flex:none}
.ptask .tx,.pcard .tx{display:flex;flex-direction:column;min-width:0}
.meta{font-size:.84em;color:var(--muted)}

.wod{display:flex;flex-direction:column;gap:12px}
.wodtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wodpic .pic{font-size:3em}
.wodpic .sw{width:64px;height:64px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.15)}
.wodw{font-size:1.7em;font-weight:700}
.wodq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:12px;border-top:1px dashed var(--line);transition:opacity .3s}
.wodq span{flex:1 1 220px;font-weight:600}
.wodq.dim{opacity:.55}

.path{position:relative;padding-left:8px}
.plvl{font-weight:700;color:var(--acc);margin:18px 0 8px 52px;font-size:.95em}
.pnode{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);position:relative;padding:6px 0}
.pnode:before{content:"";position:absolute;left:21px;top:-6px;bottom:-6px;width:4px;background:var(--line);z-index:0}
.pnode.done:before{background:var(--ok)}
.pdot{width:46px;height:46px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-weight:700;z-index:1;flex:none;color:var(--muted)}
.pdot svg{width:22px;height:22px}
.pnode.done .pdot{background:var(--ok);border-color:var(--ok);color:#fff}
.pnode.next .pdot{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 0 6px var(--acc-soft);animation:pulse2 2s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 10px var(--acc-soft)}}
.pcard{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:0}
.pnode:hover .pcard{border-color:var(--pri)}
.pnode.next .pcard{border:2px solid var(--acc)}

.steps{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.steps a{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;text-decoration:none;font-weight:600;font-size:.9em;color:var(--ink)}
.qcta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;background:var(--acc-soft);border-color:transparent}
.prac{margin-bottom:14px}
.prac .row{margin-top:8px}

.lbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.lopt{display:flex;align-items:center;gap:8px}
.seg.sm button{padding:6px 10px;font-size:.85em}
.tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.92em;user-select:none}
.tog input{position:absolute;opacity:0;width:0;height:0}
.tog span{width:42px;height:24px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex:none}
.tog span:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog input:checked+span{background:var(--ok)}
.tog input:checked+span:after{left:21px}

/* ===================== Стиль Apple ===================== */
:root{
  --bg:#f2f2f7; --card:#ffffff; --ink:#1c1c1e; --muted:#8a8a8e; --line:#e5e5ea;
  --pri:#007aff; --pri-ink:#fff; --pri-soft:#e5f0ff;
  --acc:#ff9500; --acc-soft:#fff3e0;
  --ok:#34c759; --ok-soft:#e8f8ec; --bad:#ff3b30; --bad-soft:#ffecea;
  --r:18px; --fs:17px;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Golos Text", "Segoe UI", system-ui, sans-serif;
  --sh:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
}
body.kids{--bg:#fff9ef;--pri:#007aff;--acc:#ff9500;--r:22px;--fs:19px}

body{letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
h1{font-size:2em;font-weight:700;letter-spacing:-.025em}
h2{font-size:1.32em;font-weight:700;letter-spacing:-.02em;margin:1.4em 0 .55em}

/* панели с размытием */

.side{background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-right:.5px solid rgba(0,0,0,.1)}

/* карточки и плитки */

.card{border-radius:var(--r);padding:18px 20px}

{id:"past-continuous",level:"B1",icon:"🎞️",title:"Past Continuous: что происходило",en:"Past Continuous",

<p>At 8 p.m. I <b>was watching</b> TV. В 8 вечера я смотрел телевизор (был в процессе).</p>
<p>Часто сочетается с Past Simple: длинное действие прерывается коротким. I <b>was cooking</b> when the phone <b>rang</b>.</p>
<p>Слова-подсказки: <b>while</b> (пока), <b>when</b> (когда), at that moment, at 5 o'clock yesterday.</p>`,

{id:"used-to",level:"B1",icon:"🕰️",title:"Used to: раньше бывало",en:"Used to",
 theory:`<p><b>used to + глагол</b> — о привычках и состояниях в прошлом, которых теперь нет. I <b>used to</b> smoke. Раньше я курил (а теперь нет).</p>
<p>Отрицание: I <b>didn't use to</b> like coffee. Вопрос: <b>Did you use to</b> play the piano?</p>
<p>Не путайте с <b>be used to + -ing</b> — «привыкнуть к»: I'm used to getting up early. Я привык рано вставать.</p>`,

{id:"first-conditional",level:"B1",icon:"🔀",title:"Условия: если… то (реальное)",en:"First Conditional",
 theory:`<p>Реальное условие в будущем: <b>If + Present Simple, will + глагол</b>.</p>
<p><b>If it rains, I will stay</b> at home. Если пойдёт дождь, я останусь дома.</p>
<p>После if будущее время не ставится: if it rains (а не if it will rain).</p>
<p>Так же работают when, as soon as, unless (если не): <b>Unless</b> you hurry, you'll be late.</p>
<p>Общие истины (Zero Conditional): If you heat ice, it <b>melts</b>.</p>`,

{id:"second-conditional",level:"B1",icon:"💭",title:"Условия: если бы (нереальное)",en:"Second Conditional",

{id:"passive",level:"B1",icon:"🏗️",title:"Пассивный залог",en:"Passive voice",
 theory:`<p>Пассив используют, когда важно действие или результат, а не тот, кто его совершил: <b>be + третья форма глагола</b>.</p>

<p>The bridge <b>was built</b> in 1900. Мост был построен в 1900 году.</p>
<p>Кто сделал, указывают через <b>by</b>: The book was written <b>by</b> Tolstoy.</p>`,

{id:"present-perfect-cont",level:"B1",icon:"⏳",title:"Present Perfect Continuous: уже давно",en:"Present Perfect Continuous",
 theory:`<p>Показывает действие, которое началось в прошлом и продолжается до сих пор (или только что закончилось): <b>have / has been + -ing</b>.</p>
<p>I <b>have been learning</b> English for two years. Я учу английский уже два года.</p>
<p><b>for</b> — в течение (for two hours, for a long time), <b>since</b> — с какого-то момента (since 2020, since Monday).</p>
<p>Вопрос: <b>How long have you been</b> working here? Как долго ты здесь работаешь?</p>`,

{id:"gerund-infinitive",level:"B1",icon:"🧩",title:"Глагол + to или -ing",en:"Gerund or infinitive",
 theory:`<p>После одних глаголов идёт <b>to + глагол</b>: want, decide, hope, plan, need, would like, promise, agree. I <b>want to go</b>.</p>
<p>После других идёт <b>-ing</b>: enjoy, finish, mind, avoid, keep, suggest, can't stand, practise. I <b>enjoy reading</b>.</p>
<p>После предлогов всегда -ing: interested <b>in learning</b>, good <b>at cooking</b>, thank you <b>for coming</b>.</p>
<p>Некоторые глаголы допускают обе формы почти без разницы: like, love, hate, start, begin.</p>`,

{id:"relative",level:"B1",icon:"🔗",title:"Который: who, which, that, where",en:"Relative clauses",
 theory:`<p>Чтобы уточнить, о ком или о чём речь, используем придаточные с <b>who</b> (о людях), <b>which</b> (о предметах), <b>that</b> (о людях и предметах в разговорной речи), <b>where</b> (о месте), <b>whose</b> (чей).</p>
<p>The man <b>who</b> lives next door is a doctor. Мужчина, который живёт по соседству, врач.</p>
<p>The book <b>which</b> I bought is great. Книга, которую я купил, отличная.</p>`,

{id:"reported-speech",level:"B2",icon:"🗨️",title:"Косвенная речь",en:"Reported speech",
 theory:`<p>Когда пересказываем чужие слова после said / told, время обычно сдвигается на шаг назад:</p>
<p>"I am tired." → She said (that) she <b>was</b> tired.</p>
<p>"I will call you." → He said he <b>would</b> call me.</p>
<p>"I saw the film." → She said she <b>had seen</b> the film.</p>
<p><b>say</b> — без дополнения (she said that…), <b>tell</b> — с дополнением (she told <b>me</b> that…). Вопросы: He asked me <b>where I lived</b> (порядок слов прямой).</p>`,

{id:"future-perfect",level:"B2",icon:"🔭",title:"Будущее: will be doing и will have done",en:"Future Continuous and Perfect",
 theory:`<p><b>Future Continuous</b> (will be + -ing) — действие будет в процессе в определённый момент будущего: This time tomorrow I <b>will be flying</b> to London.</p>
<p><b>Future Perfect</b> (will have + третья форма) — действие будет завершено к моменту в будущем: By Friday I <b>will have finished</b> the report.</p>
<p>Подсказки: this time next week, at 10 tomorrow; by Monday, by the end of the year, in two years' time.</p>`,

{id:"modals-deduction",level:"B2",icon:"🕵️",title:"Должно быть, не может быть",en:"Modals of deduction",
 theory:`<p>Чтобы сделать вывод, используем модальные глаголы:</p>
<p><b>must</b> — наверняка (уверен, что да): He <b>must</b> be tired. Он, должно быть, устал.</p>
<p><b>can't</b> — не может быть (уверен, что нет): It <b>can't</b> be true.</p>
<p><b>might / may / could</b> — возможно: She <b>might</b> be at home.</p>
<p>О прошлом: <b>must have / can't have / might have + третья форма</b>: He must have forgotten. Он, наверное, забыл.</p>`,
 table:[["She must be at work.","Она, должно быть, на работе."],["It can't be him.","Это не может быть он."],["They might be late.","Они, возможно, опоздают."],["You must have seen it.","Ты наверняка это видел."],["He can't have finished already.","Не может быть, что он уже закончил."]],
 ex:[["You've been working all day. You must be exhausted.","Ты работал весь день. Ты, должно быть, вымотан."],["That can't be Anna, she's in London.","Это не может быть Анна, она в Лондоне."],["Take an umbrella, it might rain.","Возьми зонт, может пойти дождь."],["I can't find my keys. I must have left them at home.","Не могу найти ключи. Наверное, оставил дома."],["She didn't answer. She might have been asleep.","Она не ответила. Возможно, она спала."]],
 tasks:[["He's been running for an hour. He ___ be tired.",["must","can't","might not"],0,"Он бегает уже час. Он, должно быть, устал."],["That ___ be true! It's impossible.",["must","can't","might"],1,"Это не может быть правдой! Это невозможно."],["Take a coat, it ___ get cold.",["might","must","can't"],0,"Возьми пальто, может похолодать."],["I can't find my phone. I must have ___ it.",["lose","lost","losing"],1,"Не могу найти телефон. Наверное, я его потерял."],["She can't ___ seen us, it was dark.",["has","have","had"],1,"Она не могла нас увидеть, было темно."],["The lights are on. They ___ be at home.","must","Свет горит. Они, должно быть, дома."]]},
{id:"question-tags",level:"B2",icon:"❔",title:"Не так ли? Разделительные вопросы",en:"Question tags",
 theory:`<p>Короткий вопрос в конце фразы, чтобы попросить согласия: «не так ли?», «правда?».</p>
<p>Утверждение → отрицательный хвостик: It's cold, <b>isn't it?</b></p>
<p>Отрицание → утвердительный хвостик: You don't smoke, <b>do you?</b></p>
<p>Хвостик повторяет вспомогательный глагол: is → isn't, can → can't, did → didn't, have → haven't. После I am — <b>aren't I?</b></p>`,
 table:[["It's nice, isn't it?","Мило, правда?"],["You can swim, can't you?","Ты умеешь плавать, да?"],["She lives here, doesn't she?","Она ведь здесь живёт?"],["They didn't come, did they?","Они ведь не пришли?"],["Let's go, shall we?","Пойдём, да?"]],
 ex:[["It's a beautiful day, isn't it?","Прекрасный день, правда?"],["You're from Moscow, aren't you?","Вы ведь из Москвы?"],["He doesn't eat meat, does he?","Он ведь не ест мясо?"],["We've met before, haven't we?","Мы ведь уже встречались?"],["You will help me, won't you?","Ты ведь мне поможешь?"]],
 tasks:[["It's cold today, ___?",["is it","isn't it","doesn't it"],1,"Сегодня холодно, правда?"],["You like coffee, ___?",["don't you","do you","aren't you"],0,"Ты ведь любишь кофе?"],["She can't drive, ___?",["can she","can't she","does she"],0,"Она ведь не умеет водить?"],["They went home, ___?",["did they","didn't they","went they"],1,"Они ведь ушли домой?"],["I'm right, ___?",["am I","aren't I","isn't it"],1,"Я ведь прав?"],["You will come, ___ you?","won't","Ты ведь придёшь?"]]},
{id:"narrative",level:"B2",icon:"📖",title:"Past Perfect: рассказ о прошлом",en:"Narrative tenses",
 theory:`<p>Чтобы рассказать историю, сочетают времена:</p>
<p><b>Past Simple</b> — основные события по порядку. <b>Past Continuous</b> — фон, что происходило. <b>Past Perfect</b> (had + третья форма) — то, что случилось ещё раньше.</p>
<p>When I arrived at the station, the train <b>had</b> already <b>left</b>. Когда я приехал на вокзал, поезд уже ушёл.</p>
<p>Связки для рассказа: first, then, after that, suddenly, in the end, eventually.</p>`,

const synth=window.speechSynthesis; let voices=[], voiceChecked=false;
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang)||v.lang==="en")}

function chooseVoice(alt){
  if(!voices.length)return null;const P_=cur();
  let v=voices.find(v=>v.name===P_.voice);
  const acc=voices.filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(P_.accent.toLowerCase()));
  const pool=acc.length?acc:voices;
  if(!v)v=pool.find(v=>/google|natural|premium|enhanced/i.test(v.name))||pool[0];
  if(alt){const others=pool.filter(x=>x!==v);if(others.length)return others.find(x=>/female|samantha|serena|kate|libby|sonia|zira|susan/i.test(x.name))||others[0]}
  return v}
let speakToken=0;
const sayable=t=>String(t).replace(/_{2,}/g,"...").replace(/…/g,"...");
function speak(text,opt={}){
  return new Promise(res=>{
    if(!synth){toast("Озвучка недоступна в этом браузере");return res(false)}
    const tok=++speakToken;synth.cancel();
    const u=new SpeechSynthesisUtterance(sayable(text));
    const v=chooseVoice(opt.alt);if(v){u.voice=v;u.lang=v.lang}else u.lang=cur().accent;
    u.rate=(opt.slow?0.6:1)*cur().rate;u.pitch=opt.alt?1.08:1;
    const btn=opt.btn;if(btn)btn.classList.add("speaking");
    let fin=false,guard=null;const done=()=>{if(fin)return;fin=true;clearTimeout(guard);if(btn)btn.classList.remove("speaking");res(tok===speakToken)};
    u.onend=done;u.onerror=done;
    setTimeout(()=>{if(tok===speakToken)synth.speak(u);else done()},40);
    guard=setTimeout(done,Math.max(6000,String(text).length*260/(u.rate||1)));
  })}

/* последовательное проигрывание с повтором ×N и паузой для повторения */
const RUN={id:0,on:false};
function setRunUI(on){RUN.on=on;$$("[data-act=playall],[data-act=dplay]").forEach(b=>{b.innerHTML=on?I.stop+" Остановить":(b.dataset.label||(I.play+" Слушать все"))})}
async function playSeq(rows,getText,opts={}){
  const my=++RUN.id;setRunUI(true);const P_=cur();
  for(const r of rows){
    if(my!==RUN.id||!document.body.contains(r))break;
    rows.forEach(x=>x.classList.remove("now"));r.classList.add("now");r.scrollIntoView({block:"nearest",behavior:"smooth"});
    if(opts.roleSkip&&opts.roleSkip(r)){if(opts.onRole)await opts.onRole(r);if(my!==RUN.id)break;continue}
    for(let k=0;k<P_.rep;k++){const ok=await speak(getText(r),{alt:opts.alt?opts.alt(r):false});if(!ok||my!==RUN.id)break;await wait(350)}
    if(my!==RUN.id)break;
    if(P_.pause)await countdown(r,repeatTime(getText(r)),my);
  }
  if(my===RUN.id){rows.forEach(x=>x.classList.remove("now"));setRunUI(false);if(opts.onDone)opts.onDone()}
}
async function countdown(row,ms,my){
  const bar=document.createElement("div");bar.className="turnbar";bar.innerHTML=`<span>Ваша очередь: повторите вслух</span><i style="animation-duration:${ms}ms"></i>`;
  (row.querySelector(".tx")||row.querySelector(".bx")||row).appendChild(bar);
  const t0=Date.now();while(Date.now()-t0<ms&&my===RUN.id)await wait(100);bar.remove()}

const REC={stream:null,rec:null,url:null,text:"",slow:false,state:"idle",timer:null,dur:3000};
function recPanel(){
  let el=$("#recp");if(!el){el=document.createElement("div");el.id="recp";el.className="recp";document.body.appendChild(el)}
  const st=REC.state;
  el.innerHTML=`<div class="recin"><button class="iconbtn x" data-act="recclose" aria-label="Закрыть">${I.x}</button>
  <div class="small muted">Повтори за диктором</div><div class="en" style="font-size:1.25em;margin:4px 0 10px" data-en="${esc(REC.text)}">${en(REC.text)}</div>
  <div class="recstate ${st}">${st==="listen"?"Слушайте диктора…":st==="rec"?`<span class="dot"></span> Говорите! Идёт запись <i style="animation-duration:${REC.dur}ms"></i>`:st==="say"?`Повторите вслух <i style="animation-duration:${REC.dur}ms"></i>`:st==="done"?(REC.url?"Готово! Сравните свой голос с диктором.":"Отлично! Повторите ещё раз, чтобы закрепить."):""}</div>
  <div class="row" style="margin-top:12px">
   <button class="btn" data-act="recspk">${I.play} Диктор</button>

   ${REC.url?`<button class="btn acc" data-act="recme">${I.play} Мой голос</button>`:""}
   ${st==="rec"?`<button class="btn pri" data-act="recstop">Готово</button>`:st==="done"||st==="idle"?`<button class="btn pri" data-act="recagain">${I.mic} Ещё раз</button>`:""}
  </div>${!canRec?`<div class="small muted" style="margin-top:8px">Запись голоса в этом браузере недоступна, поэтому просто повторяйте вслух во время паузы.</div>`:""}</div>`}
function stopRec(hide){clearTimeout(REC.timer);REC.tok=(REC.tok||0)+(hide?1:0);if(REC.rec&&REC.rec.state==="recording"){REC.cancel=!!hide;try{REC.rec.stop()}catch(e){}}if(REC.stream){REC.stream.getTracks().forEach(t=>t.stop());REC.stream=null}if(hide){const el=$("#recp");if(el)el.remove();REC.state="idle"}}
function recDone(){if(S){S.rec++;act("rec");addXP(5)}}
async function shadow(text,slow){
  stopRec(false);REC.text=text;REC.slow=!!slow;if(REC.url){URL.revokeObjectURL(REC.url);REC.url=null}
  const tok=REC.tok=(REC.tok||0)+1;
  REC.state="listen";recPanel();
  await speak(text,{slow});if(tok!==REC.tok||!$("#recp"))return;
  REC.dur=repeatTime(text)+(slow?1500:0);
  if(canRec){try{REC.stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){REC.stream=null;toast("Нет доступа к микрофону: повторите вслух без записи")}}
  if(tok!==REC.tok||!$("#recp")){if(REC.stream){REC.stream.getTracks().forEach(t=>t.stop());REC.stream=null}return}
  if(REC.stream){
    const chunks=[];let r=null;try{r=new MediaRecorder(REC.stream)}catch(e){}
    if(r){REC.rec=r;REC.cancel=false;r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      r.onstop=()=>{if(REC.stream){REC.stream.getTracks().forEach(t=>t.stop());REC.stream=null}if(REC.cancel||tok!==REC.tok)return;
        REC.url=URL.createObjectURL(new Blob(chunks,{type:r.mimeType||"audio/webm"}));REC.state="done";recPanel();recDone();new Audio(REC.url).play().catch(()=>{})};
      r.start();REC.state="rec";recPanel();REC.timer=setTimeout(()=>{if(r.state==="recording")r.stop()},REC.dur);return}}
  REC.state="say";recPanel();REC.timer=setTimeout(()=>{if(tok!==REC.tok)return;REC.state="done";recPanel();recDone()},REC.dur)}

  r.onresult=e=>res(Array.from(e.results[0]).map(a=>a.transcript));r.onerror=e=>rej(e.error);r.onend=()=>res([]);try{r.start()}catch(e){rej(e)}})}
function clean(s){return String(s).toLowerCase().replace(/’/g,"'").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim()}
function simil(a,b){a=clean(a);b=clean(b);if(!a||!b)return 0;const A=a.split(" "),B=b.split(" ");let hit=0;const bb=B.slice();A.forEach(w=>{const i=bb.indexOf(w);if(i>=0){hit++;bb.splice(i,1)}});return hit/Math.max(A.length,B.length)}

let popEl=null;
function closePop(){if(popEl){popEl.remove();popEl=null}}
function showPop(wordEl){
  closePop();
  const w=wordEl.textContent.replace(/’/g,"'");
  const sent=wordEl.closest("[data-en]");
  const words=$$(".w",wordEl.parentElement);const idx=words.indexOf(wordEl);
  const entries=[];const seq=words.map(x=>x.textContent.toLowerCase().replace(/’/g,"'"));
  for(let len=4;len>=2;len--)for(let s=Math.max(0,idx-len+1);s<=idx&&s+len<=seq.length;s++){const k=seq.slice(s,s+len).join(" ");if(LEX[k]&&!entries.find(e=>e.k===k))entries.push({k,tr:LEX[k]})}
  const one=lookup(w);
  if(one)entries.push({k:one.key,tr:one.tr,main:1});else if(/^[A-Z]/.test(w)&&idx>0)entries.push({k:w,tr:"имя собственное (имя, название)",main:1});
  const ctx=sent?sent.getAttribute("data-en"):w;const ruEl=sent?$(".ru",sent):null;const ctxRu=ruEl?ruEl.textContent:"";
  const saved=S&&S.my.some(m=>m[0].toLowerCase()===(one?one.key:w.toLowerCase()));
  const el=document.createElement("div");el.className="pop";
  el.innerHTML=`<button class="iconbtn x" data-act="closepop" aria-label="Закрыть">${I.x}</button>
   <div class="row"><div class="pw">${esc(w)}</div>${playBtns(w)}</div>
   ${entries.length?entries.map(e=>`<div class="pt">${e.main?"":`<b>${esc(e.k)}</b>: `}${esc(e.tr)}</div>`).join(""):`<div class="pt muted">Этого слова нет во встроенном словаре. Откройте онлайн-переводчик.</div>`}
   ${ctxRu&&ctx!==w?`<div class="small muted" style="margin-bottom:8px">Вся фраза: ${esc(ctxRu)}</div>`:""}
   <div class="row">${one&&S?`<button class="btn" data-act="saveword" data-w="${esc(one.key)}" data-t="${esc(one.tr)}">${saved?"★ В моих словах":"☆ В мои слова"}</button>`:""}
    <a class="btn" target="_blank" rel="noopener" href="https://translate.yandex.ru/?source_lang=en&target_lang=ru&text=${encodeURIComponent(ctx)}">Яндекс</a>
    <a class="btn" target="_blank" rel="noopener" href="https://translate.google.com/?sl=en&tl=ru&op=translate&text=${encodeURIComponent(ctx)}">Google</a></div>`;
  document.body.appendChild(el);popEl=el;
  const r=wordEl.getBoundingClientRect();const pw=el.offsetWidth,ph=el.offsetHeight;
  let x=Math.min(Math.max(10,r.left),innerWidth-pw-10),y=r.bottom+8;if(y+ph>innerHeight-10)y=Math.max(10,r.top-ph-8);
  el.style.left=x+"px";el.style.top=y+"px";speak(w)}

  <div class="card">${body}<div id="fb">${Q.fb||""}</div></div></div>`}
function correctText(q){if(q.type==="choice"){const o=q.opts.find(x=>x.ok);return o?o.t:""}if(q.type==="input")return q.ans[0];return q.ans}
function qFeedback(ok,el){

const LVLS=["A1","A2","B1","B2"];
function startPlacement(){const qs=window.PLACEMENT.map(p=>({type:"choice",lvl:p[0],ins:["Choose the correct answer.","Выберите правильный ответ."],text:p[1],tru:p[4],opts:p[2].map((o,j)=>({t:o,ok:j===p[3]}))}));

function finishPlacement(){
  const sc={};LVLS.forEach(l=>sc[l]=[0,0]);(Q.res||[]).forEach(r=>{if(r&&sc[r.lvl]){sc[r.lvl][1]++;if(r.ok)sc[r.lvl][0]++}});
  let cefr="A0";for(const l of LVLS){const [a,n]=sc[l];if(n&&a/n>=0.66)cefr=l;else break}

/* --- Переводчик --- */
function searchAll(q){
  q=q.trim().toLowerCase();if(!q)return [];const out=[];const seen=new Set();
  const add=(e,r,src)=>{const k=e+"|"+r;if(seen.has(k))return;seen.add(k);out.push([e,r,src])};
  const ru=isRu(q);const hit=(e,r)=>ru?r.toLowerCase().includes(q):e.toLowerCase().includes(q);
  V.forEach(t=>t.words.forEach(w=>{if(hit(w[0],w[1]))add(w[0],w[1],t.title)}));
  P.forEach(c=>c.items.forEach(w=>{if(hit(w[0],w[1]))add(w[0],w[1],c.title)}));
  if(ru)Object.keys(LEX).forEach(k=>{if(LEX[k].toLowerCase().includes(q))add(k,LEX[k],"Словарь")});
  else Object.keys(LEX).forEach(k=>{if(k===q||k.startsWith(q+" "))add(k,LEX[k],"Словарь")});
  L.forEach(l=>l.ex.forEach(e=>{if(hit(e[0],e[1]))add(e[0],e[1],"Урок: "+l.title)}));
  D.forEach(d=>d.lines.forEach(e=>{if(hit(e[1],e[2]))add(e[1],e[2],"Диалог: "+d.title)}));
  out.sort((a,b)=>{const ea=(ru?a[1]:a[0]).toLowerCase(),eb=(ru?b[1]:b[0]).toLowerCase();return (ea===q?0:ea.startsWith(q)?1:2)-(eb===q?0:eb.startsWith(q)?1:2)||ea.length-eb.length});
  return out.slice(0,40)}

  if(q){const hits=searchAll(q);

    const sl=ru?"ru":"en",tl=ru?"en":"ru";
    res+=`<div class="row" style="margin-top:14px"><a class="btn" target="_blank" rel="noopener" href="https://translate.yandex.ru/?source_lang=${sl}&target_lang=${tl}&text=${encodeURIComponent(q)}">Открыть в Яндекс Переводчике</a><a class="btn" target="_blank" rel="noopener" href="https://translate.google.com/?sl=${sl}&tl=${tl}&op=translate&text=${encodeURIComponent(q)}">Открыть в Google Переводчике</a></div>`}

async function ttsRead(slow){
  const t=$("#ttsin").value.trim();TTS.text=t;if(!t)return;const parts=t.match(/[^.!?\n]+[.!?]*/g)||[t];
  const out=$("#ttsout");out.classList.remove("hidden");out.innerHTML=parts.filter(p=>p.trim()).map(p=>`<div class="ttsl sent" data-en="${esc(p.trim())}"><div class="tx"><span class="en">${en(p.trim())}</span></div><button type="button" class="play rec" data-shadow="${esc(p.trim())}" title="Повторить за диктором">${I.mic}</button></div>`).join("");
  const rows=$$(".ttsl",out);const my=++RUN.id;const P_=cur();setRunUI(true);
  for(const r of rows){if(my!==RUN.id)break;rows.forEach(x=>x.classList.remove("now"));r.classList.add("now");
    for(let k=0;k<P_.rep;k++){const ok=await speak(r.dataset.en,{slow});if(!ok||my!==RUN.id)break;await wait(300)}
    if(my!==RUN.id)break;if(P_.pause)await countdown(r,repeatTime(r.dataset.en),my)}
  rows.forEach(x=>x.classList.remove("now"));if(my===RUN.id)setRunUI(false)}

/* --- Часы --- */
const NUM=["twelve","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
function timeWords(h,m){const H=h%12||12,N=(h%12)+1;const nm={5:"five",10:"ten",15:"quarter",20:"twenty",25:"twenty-five",30:"half"};
  if(m===0)return NUM[H]+" o'clock";if(m<=30)return nm[m]+" past "+NUM[H];return nm[60-m]+" to "+NUM[N>12?1:N]}
function clockSvg(h,m){const ha=((h%12)+m/60)*30,ma=m*6;let t="";for(let k=1;k<=12;k++){const a=k*30*Math.PI/180;t+=`<text x="${100+72*Math.sin(a)}" y="${106-72*Math.cos(a)}" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">${k}</text>`}
  let ticks="";for(let k=0;k<60;k++){const a=k*6*Math.PI/180,r1=k%5?88:84;ticks+=`<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+92*Math.sin(a)}" y2="${100-92*Math.cos(a)}" stroke="currentColor" stroke-width="${k%5?1:2.5}" opacity=".6"/>`}
  return `<svg class="clock" viewBox="0 0 200 200" style="color:var(--ink)"><circle cx="100" cy="100" r="96" fill="var(--card)" stroke="var(--pri)" stroke-width="6"/>${ticks}${t}<line x1="100" y1="100" x2="${100+45*Math.sin(ha*Math.PI/180)}" y2="${100-45*Math.cos(ha*Math.PI/180)}" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/><line x1="100" y1="100" x2="${100+70*Math.sin(ma*Math.PI/180)}" y2="${100-70*Math.cos(ma*Math.PI/180)}" stroke="var(--acc)" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="var(--ink)"/></svg>`}
let CK=null;
function newClock(){const h=1+Math.floor(Math.random()*12),m=Math.floor(Math.random()*12)*5;const right=timeWords(h,m);const wrong=new Set();let guard=0;while(wrong.size<3&&guard++<200){const h2=1+Math.floor(Math.random()*12),m2=(m+[0,5,10,15,30,45][Math.floor(Math.random()*6)]+60)%60;const w=timeWords(Math.random()<.5?h:h2,m2);if(w!==right)wrong.add(w)}
  CK={h,m,right,opts:shuffle([right].concat([...wrong])),done:false,score:(CK?CK.score:0),n:(CK?CK.n:0)}}
function vClock(){if(!CK)newClock();
  return `<p class="muted">Посмотрите на часы и выберите, как правильно назвать время. Подсказка: <b>past</b> значит «после» (первая половина часа), <b>to</b> значит «до» (вторая половина), <b>quarter</b> это 15 минут, <b>half</b> это 30 минут.</p>
  <div class="card quiz" style="text-align:center">${clockSvg(CK.h,CK.m)}<div class="muted" style="font-size:1.3em;font-weight:700">${CK.h}:${String(CK.m).padStart(2,"0")}</div>
  <div class="qins" style="text-align:center"><div class="qi-en" style="justify-content:center">${en("What time is it?")}<button type="button" class="play pmini" data-say="What time is it?">${I.play}</button></div><div class="qi-ru">Который час?</div></div>
  <div class="opts">${CK.opts.map((o,j)=>`<button class="opt" data-ck="${j}" ${CK.done?"disabled":""}>It's ${esc(o)}.</button>`).join("")}</div><div id="fb"></div>
  <p class="small muted" style="margin-top:12px">Правильных ответов: ${CK.score} из ${CK.n}</p></div>`}

  else if(a==="hidehelp"){S.help=false;save();render()}
  else if(a==="wodknow"){const w=S.wod.en;srsOk(w);srsOk(w);S.wod.skip=((S.wod.skip||[]).concat(w)).slice(-500);S.wod.n=(S.wod.n||0)+1;S.wod.date="";addXP(2,ac);save();render();toast("Отлично! Вот новое слово");setTimeout(()=>{const b=$(".wod .play");if(b)b.click()},400)}
  else if(a==="wodlearn"){const w=S.wod.en;const it=[].concat(...V.map(t=>t.words)).find(x=>x[0]===w);if(it&&!S.my.some(m=>m[0]===w))S.my.unshift([w,it[1]]);S.known[w]={b:0,due:Date.now()+20*36e5};S.wod.state="learn";save();render();toast("Добавлено в «Мои слова»")}
  else if(a==="wodnext"){S.wod.skip=((S.wod.skip||[]).concat(S.wod.en)).slice(-500);S.wod.n=(S.wod.n||0)+1;S.wod.date="";save();render();setTimeout(()=>{const b=$(".wod .play");if(b)b.click()},400)}
  else if(a==="playall"){if(RUN.on){stopAll();return}const box=ac.closest(".card")||$("#view");playSeq($$(".sent",box),r=>r.dataset.en)}
  else if(a==="dplay"){if(RUN.on){stopAll();return}playDialog(D.find(x=>x.id===route.id))}
  else if(a==="startlesson"){const l=L.find(x=>x.id===route.id);startQuiz(l.title,lessonQuiz(l),(st,pct)=>{const old=S.lessons[l.id];const first=!old;if(!old||old.stars<=st)S.lessons[l.id]={stars:Math.max(st,1),pct,day:today()};act("lesson");track("lesson_done");addXP(first?st*10+10:st*3)},"#/lesson/"+l.id)}
  else if(a==="qnext"){Q.i++;Q.answered=false;Q.retry=false;Q.fb="";Q.order=[];Q.pool=null;render();window.scrollTo({top:0});const q=Q.qs[Q.i];if(q&&q.listen)setTimeout(()=>speak(q.listen),300)}
  else if(a==="qtry"){const q=Q.qs[Q.i];Q.answered=false;Q.retry=true;Q.fb="";Q.order=[];render();if(q.listen)speak(q.listen)}
  else if(a==="qretry"){Q.i=0;Q.score=0;Q.answered=false;Q.retry=false;Q.ended=false;Q.fb="";Q.order=[];Q.pool=null;Q.qs=shuffle(Q.qs).map(q=>{if(q.opts)q.opts.forEach(o=>{delete o.dis;delete o.sel});return q});render();const q=Q.qs[0];if(q&&q.listen)setTimeout(()=>speak(q.listen),300)}
  else if(a==="qexit"){go(Q&&Q.back||"#/home")}
  else if(a==="qclear"){if(!Q.answered){Q.order=[];render()}}
  else if(a==="qskip"){Q.answered=true;Q.fb=`<div class="row" style="margin-top:12px"><button class="btn pri" data-act="qnext">Next / Дальше</button></div>`;render()}
  else if(a==="qcheck"&&Q&&!Q.answered){const q=Q.qs[Q.i];
    if(q.type==="input"){const v=$("#qin").value;if(!v.trim()){$("#qin").focus();return}Q.lastInput=v;const ok=q.ans.some(x=>clean(x)===clean(v));qFeedback(ok,ac)}
    if(q.type==="order"){if(!Q.order.length)return;const ok=clean(Q.order.map(x=>x.t).join(" "))===clean(q.ans);qFeedback(ok,ac)}}
  else if(a==="qmic"){const q=Q.qs[Q.i];ac.disabled=true;ac.innerHTML=I.mic+" Говорите…";try{const alts=await listen();const best=Math.max(0,...alts.map(x=>simil(x,q.ans)));qFeedback(best>=0.75,ac);if(alts[0])$("#fb").insertAdjacentHTML("afterbegin",`<p class="small muted">Услышано: «${esc(alts[0])}»</p>`)}catch(err){toast(err==="not-allowed"?"Разрешите доступ к микрофону":"Не удалось распознать речь");ac.disabled=false;ac.innerHTML=I.mic+" Сказать"}}
  else if(a==="flip"){FC.flip=!FC.flip;$(".flash").classList.toggle("fl",FC.flip);if(!FC.flip)speak(ce(FC.items[FC.i].en))}
  else if(a==="fcyes"||a==="fcno"){const c=FC.items[FC.i];if(a==="fcyes"){FC.ok++;srsOk(c.en);act("cards");addXP(5,ac)}else{srsBad(c.en);if(!c.again)FC.items.push(Object.assign({},c,{again:1}));save()}FC.i++;FC.flip=false;render();if(FC.i<FC.items.length)speak(ce(FC.items[FC.i].en))}
  else if(a==="fcagain"){FC=null;render()}
  else if(a==="fixstart"){startQuiz("Работа над ошибками",S.mistakes.slice(0,10).map(m=>{const c=JSON.parse(JSON.stringify(m));if(c.opts){c.opts.forEach(o=>{delete o.dis;delete o.sel});c.opts=shuffle(c.opts)}return c}),null,"#/mistakes","mistakes")}
  else if(a==="clearmist"){if(ac.dataset.sure){S.mistakes=[];save();render()}else{ac.dataset.sure=1;ac.textContent="Точно очистить?"}}
  else if(a==="reveal"){const b=ac.closest(".bx");$(".en",b).classList.remove("hidden");$(".hideme",b).classList.add("hidden");ac.remove()}
  else if(a==="cknext"){newClock();render()}
  else if(a==="abcall"){if(RUN.on){stopAll();return}const my=++RUN.id;for(const x of ABC){if(my!==RUN.id)break;const ok=await speak(x[0]);if(!ok)break}}
  else if(a==="reset"){if(ac.dataset.sure){Object.assign(S,{xp:0,xpDay:{},act:{},lessons:{},known:{},my:[],days:[],mistakes:[],badges:{},rec:0,dlgDone:{},last:null,fixed:0,wod:null,placement:null,cefr:null,level:null,start:0});save();render();toast("Прогресс сброшен")}else{ac.dataset.sure="1";ac.textContent="Точно сбросить?";ac.classList.add("acc")}}
  else if(a==="delprof"){if(ac.dataset.sure){delete ROOT.profiles[S.id];const id=Object.keys(ROOT.profiles)[0];S=ROOT.profiles[id];save();go("#/home");render()}else{ac.dataset.sure=1;ac.textContent="Точно удалить «"+(S.name||"профиль")+"»?";ac.classList.add("acc")}}
  else if(a==="wdone"){W.name=$("#wname").value.trim();if(!W.name){$("#wname").focus();toast("Напишите имя");return}
    const isEdit=!!(route.q.edit&&S);
    if(isEdit)Object.assign(S,{name:W.name,kind:W.kind,avatar:W.avatar,goal:W.goal});
    else{const p=newProfile({name:W.name,kind:W.kind,avatar:W.avatar,start:W.start==="test"?0:W.start,goal:W.goal,rate:W.kind==="kid"?0.85:0.9});ROOT.profiles[p.id]=p;S=p;track("profile_created")}
    const toTest=!isEdit&&W.start==="test";save();W={name:"",kind:"adult",avatar:"🦊",start:0,goal:50};go(toTest?"#/placement":"#/home");if(!isEdit)setTimeout(()=>confetti(true),200)}
  else if(a==="export"){const blob=new Blob([JSON.stringify(Object.assign({app:"Trufflish",saved:new Date().toISOString()},ROOT))],{type:"application/json"});const u=URL.createObjectURL(blob);const l=document.createElement("a");l.href=u;l.download="trufflish-progress-"+today()+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast("Файл сохранён в «Загрузки»")}
  else if(a==="ab5"){$("#aud").currentTime-=5}
  else if(a==="af5"){$("#aud").currentTime+=5}
  else if(a==="trackloop"){PL.loop=!PL.loop;const au=$("#aud");if(au)au.loop=PL.loop;ac.classList.toggle("pri",PL.loop);toast(PL.loop?"Трек будет повторяться":"Повтор трека выключен")}
  else if(a==="abloop"){const au=$("#aud");if(PL.a===null){PL.a=au.currentTime;ac.innerHTML=I.repeat+" Отметить конец фрагмента";ac.classList.add("acc")}else if(PL.b===null){PL.b=au.currentTime;if(PL.b<=PL.a+0.3){PL.a=PL.b=null;ac.innerHTML=I.repeat+" Повторять фрагмент";ac.classList.remove("acc");return}au.currentTime=PL.a;au.play();ac.innerHTML=I.stop+" Выключить повтор"}else{PL.a=PL.b=null;ac.innerHTML=I.repeat+" Повторять фрагмент";ac.classList.remove("acc")}}
  else if(a==="ttsgo"){if(RUN.on)stopAll();ttsRead(false)}
  else if(a==="ttsslow"){if(RUN.on)stopAll();ttsRead(true)}
  else if(a==="ttsstop")stopAll();
  else if(a==="recclose")stopRec(true);
  else if(a==="recspk")speak(REC.text);
  else if(a==="recspkslow")speak(REC.text,{slow:true});
  else if(a==="recme"){if(REC.url)new Audio(REC.url).play().catch(()=>{})}
  else if(a==="recstop"){clearTimeout(REC.timer);if(REC.rec&&REC.rec.state==="recording")REC.rec.stop()}
  else if(a==="recagain")shadow(REC.text,REC.slow);
});
document.addEventListener("change",e=>{
  const t=e.target;const a=t.dataset&&t.dataset.act;
  if(a==="pause"){S.pause=t.checked;save();$$("[data-act=pause]").forEach(x=>x.checked=S.pause);toast(S.pause?"После каждой фразы будет пауза для повторения":"Пауза выключена")}
  if(a==="toggleru"){S.showRu=t.checked;save()}
  if(a==="dark"){S.dark=t.checked;save();render()}
  if(a==="help"){S.help=t.checked;save()}
  if(t.id==="psrc")history.replaceState(null,"","#/practice?src="+t.value);
  if(t.id==="vsel"){S.voice=t.value;save();speak("Hello! Nice to meet you.")}
  if(t.id==="pfile"){PL.files=Array.from(t.files).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));plRender();if(PL.files.length)plPlay(0)}
  if(t.id==="impf"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.profiles||typeof d.profiles!=="object")throw 0;
    Object.keys(d.profiles).forEach(id=>{ROOT.profiles[id]=newProfile(d.profiles[id])});ROOT.cur=d.cur&&ROOT.profiles[d.cur]?d.cur:Object.keys(ROOT.profiles)[0];S=ROOT.profiles[ROOT.cur];save();toast("Прогресс загружен");go("#/home");render()}catch(err){toast("Это не файл прогресса Trufflish")}};fr.readAsText(t.files[0])}
});
document.addEventListener("submit",e=>{if(e.target.id==="trf"){e.preventDefault();go("#/translate?q="+encodeURIComponent($("#trq").value.trim()))}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="qin"){e.preventDefault();const b=$("[data-act=qnext]")||$("[data-act=qcheck]");if(b)b.click()}if(e.key==="Enter"&&e.target.id==="wname"){e.preventDefault();$("[data-act=wdone]").click()}if(e.key==="Escape"){closePop();stopRec(true)}});
document.addEventListener("input",e=>{if(e.target.id==="rate"){S.rate=+e.target.value;$("#rv").textContent=S.rate;save()}if(e.target.id==="wname")W.name=e.target.value;if(e.target.id==="ttsin")TTS.text=e.target.value});
document.addEventListener("timeupdate",e=>{if(e.target.id==="aud"&&PL.a!==null&&PL.b!==null&&e.target.currentTime>=PL.b){e.target.currentTime=PL.a}},true);
document.addEventListener("ended",e=>{if(e.target.id==="aud"&&!PL.loop&&PL.i<PL.files.length-1)plPlay(PL.i+1)},true);

shell();parse();
if(S){checkBadges();save()}
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
